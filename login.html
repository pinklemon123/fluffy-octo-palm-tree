<!doctype html><html><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="stylesheet" href="styles.css"/>
<title>登录</title></head><body>
<h2>登录</h2>
<div>
  <input id="username" placeholder="用户名"/>
  <input id="password" type="password" placeholder="密码"/>
  <button id="btn">登录</button>
</div>
<p style="color: #666; font-size: 14px;">💡 没有账号？第一次登录会自动创建账号</p>
<p><a href="index.html">← 返回首页</a></p>
<script>
const u = document.getElementById('username');
const p = document.getElementById('password');
document.getElementById('btn').onclick = async () => {
  const payload = {username:u.value.trim(), password:p.value};
  if(!payload.username || !payload.password) return alert('请输入用户名和密码');
  const r = await fetch('/api/users/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const j = await r.json();
  if(j.ok){ 
    localStorage.setItem('token',j.token); 
    localStorage.setItem('userId', j.userId);
    localStorage.setItem('username', payload.username);
    
    // 保存完整的用户对象，供发帖使用
    const currentUser = {
      id: j.userId,
      username: payload.username
    };
    localStorage.setItem('currentUser', JSON.stringify(currentUser));
    
    // 如果是新用户，给个提示
    if(j.isNewUser) {
      alert(`欢迎 ${payload.username}！账号已自动创建`);
    }
    
    location.href='index.html'; 
  } else { 
    alert(j.error||'登录失败'); 
  }
};
</script>
</body></html>
