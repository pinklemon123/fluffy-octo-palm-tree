<!doctype html><html><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="stylesheet" href="/styles.css"/>
<title>登录</title></head><body>
<h2>登录</h2>
<div>
  <input id="username" placeholder="用户名"/>
  <input id="password" type="password" placeholder="密码"/>
  <button id="btn">登录</button>
</div>
<p><a href="/register">没有账号？去注册</a></p>
<script>
const u = document.getElementById('username');
const p = document.getElementById('password');
document.getElementById('btn').onclick = async () => {
  const payload = {username:u.value.trim(), password:p.value};
  if(!payload.username || !payload.password) return alert('请输入用户名和密码');
  const r = await fetch('/api/users/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const j = await r.json();
  if(j.ok){ localStorage.setItem('token',j.token); location.href='/'; } else { alert(j.error||'失败'); }
};
</script>
</body></html>
