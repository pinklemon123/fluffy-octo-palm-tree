<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 · FreeChat Forum</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="page">
    <header class="top-bar">
      <div class="top-bar__brand">
        <h1>欢迎回来 👋</h1>
        <p>输入用户名和密码即可返回讨论区，继续与你的朋友们交流。</p>
      </div>
      <nav>
        <a href="/">讨论区</a>
        <a href="/profile.html">我的主页</a>
        <a href="/login.html">登录</a>
        <a href="/register.html">注册</a>
      </nav>
    </header>

    <main>
      <section class="panel">
        <h2>登录账号</h2>
        <div class="form-grid">
          <label for="username">用户名</label>
          <input id="username" type="text" placeholder="请输入用户名" autocomplete="username" />

          <label for="password">密码</label>
          <input id="password" type="password" placeholder="请输入密码" autocomplete="current-password" />
        </div>
        <button id="btn">立即登录</button>
        <p class="notice" id="loginNotice"></p>
        <p style="margin-top:1.25rem;color:var(--text-muted);">
          还没有账号？<a href="/register.html">立即注册</a>
        </p>
      </section>
    </main>

    <footer>FreeChat Forum · Neon + Vercel 驱动</footer>

    <script>
      const btn = document.getElementById('btn');
      const usernameEl = document.getElementById('username');
      const passwordEl = document.getElementById('password');
      const noticeEl = document.getElementById('loginNotice');

      function setNotice(msg) {
        noticeEl.textContent = msg || '';
      }

      btn.addEventListener('click', async () => {
        const username = usernameEl.value.trim();
        const password = passwordEl.value.trim();
        if (!username || !password) {
          setNotice('请输入用户名和密码');
          return;
        }
        setNotice('登录中...');
        try {
          const r = await fetch('/api/users/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
          const j = await r.json();
          if (j.ok && j.token) {
            localStorage.setItem('token', j.token);
            setNotice('登录成功，正在跳转...');
            window.location.href = '/';
          } else {
            setNotice(j.error || '登录失败');
          }
        } catch (error) {
          console.error(error);
          setNotice('登录失败，请稍后再试');
        }
      });
    </script>
  </body>
</html>
