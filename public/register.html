<!doctype html><html><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="stylesheet" href="/styles.css"/>
<title>注册</title></head><body>
<h2>注册</h2>
<div>
  <input id="username" placeholder="用户名"/>
  <input id="password" type="password" placeholder="密码"/>
  <button id="btn">注册</button>
</div>
<p><a href="/login.html">已有账号？去登录</a></p>
<script>
document.getElementById('btn').onclick = async () => {
  const username = username.value.trim(), password = password.value.trim();
  const r = await fetch('/api/users/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
  const j = await r.json();
  if(j.ok){ alert('注册成功'); location.href='/login.html'; } else { alert(j.error||'失败'); }
};
</script>
</body></html>
