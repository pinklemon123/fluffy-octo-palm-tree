<!doctype html><html><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="stylesheet" href="styles.css"/>
<title>讨论区</title>
<style>
:root{
  --brand:#22c55e;
  --brand-600:#16a34a;
  --brand-50:#ecfdf5;
  --text:#111827;
  --muted:#6b7280;
  --card:#ffffff;
  --bg:#f6f7f8;
  --border:#e5e7eb;
  --radius:14px;
  --shadow:0 6px 24px rgba(16,185,129,.12);
}

html,body{background:var(--bg); color:var(--text); margin:0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;}
.container{max-width:920px;margin:0 auto;padding:24px;}

.row{display:flex;gap:12px;align-items:center}

.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--brand-50);color:var(--brand-600);font-size:12px;border:1px solid #d1fae5}

.btn{
  display:inline-flex;align-items:center;justify-content:center;
  padding:8px 14px;border-radius:12px;border:1px solid var(--border);
  background:#fff; transition:.2s; cursor:pointer; text-decoration:none;
}
.btn:hover{box-shadow:var(--shadow)}
.btn-primary{background:var(--brand); color:#fff; border-color:var(--brand); }
.btn-primary:hover{background:var(--brand-600)}

.card{
  background:var(--card); border:1px solid var(--border);
  border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin:12px 0;
}

.post{margin-bottom:16px}
.post .meta{color:var(--muted);font-size:12px;margin-bottom:6px}
.post .content{line-height:1.6}

#authBox a{color:var(--text);text-decoration:none;margin-left:12px}
#authBox a:hover{color:var(--brand-600)}
</style>
</head><body>
<div class="container">
<div class="row" style="margin-bottom:20px">
  <h2 style="flex:1;margin:0">公共讨论区</h2>
  <div id="authBox">
    <a href="#" id="mineLink" class="btn">我的</a>
    <a href="login.html" id="loginLink" class="btn">登录</a>
    <button id="logoutBtn" class="btn" style="display:none">退出</button>
  </div>
</div>

<div id="dbStatus" class="badge" style="margin-bottom:20px"></div>

<!-- 发帖区域 -->
<div class="card" style="margin-bottom:24px">
  <div style="display:flex;gap:12px;align-items:flex-start">
    <textarea id="content" rows="3" style="flex:1;border:1px solid var(--border);border-radius:8px;padding:12px;resize:vertical" placeholder="说点什么..."></textarea>
    <div style="display:flex;flex-direction:column;gap:8px">
      <input type="file" id="fileInput" style="font-size:12px" />
      <button id="send" class="btn btn-primary">发送</button>
    </div>
  </div>
</div>

<div id="counter" style="margin-bottom:16px;color:var(--muted);font-size:14px"></div>
<div id="list"></div>

</div>

<script>
// 封装成函数，随用随取
const getUserId = () => localStorage.getItem('userId');
const getToken = () => localStorage.getItem('token'); // 保留以备后用

const loginLink = document.getElementById('loginLink');
const logoutBtn = document.getElementById('logoutBtn');

// 初始 UI  
if (getUserId()) { 
  loginLink.style.display='none'; 
  logoutBtn.style.display='inline-block'; 
}
logoutBtn.onclick = ()=>{ 
  localStorage.removeItem('token'); 
  localStorage.removeItem('userId'); 
  location.reload(); 
};

function escapeHtml(s){return (s||'').replace(/[&<>"]|'/g,m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));}

// 检查数据库状态
async function checkDatabase() {
  try {
    const r = await fetch('/api/debug/db');
    const j = await r.json();
    const el = document.getElementById('dbStatus');
    if(j.ok) {
      el.textContent = '✅ 数据库已连接';
    } else {
      el.textContent = `❌ 数据库连接失败: ${j.error?.message || '未知错误'}`;
      el.style.background = '#fee2e2';
      el.style.color = '#dc2626';
      el.style.borderColor = '#fca5a5';
    }
  } catch(e) {
    const el = document.getElementById('dbStatus');
    el.textContent = '❌ 数据库连接失败 - 网络错误';
    el.style.background = '#fee2e2';
    el.style.color = '#dc2626';
    el.style.borderColor = '#fca5a5';
  }
}

async function load(){
  const r = await fetch('/api/posts/list'); const j = await r.json();
  const items = j.data||[];
  document.getElementById('counter').textContent = `共 ${items.length} 条帖子`;
  const el = document.getElementById('list'); el.innerHTML='';
  items.forEach(p=>{
    let preview = '';
    if (p.image_url) {
      preview = `<img src='${escapeHtml(p.image_url)}' style='max-width:160px;max-height:120px;border-radius:6px'>`;
    } else if (p.file && p.file.mime) {
      const fileUrl = `/api/files/${p.file.id}`;
      if (p.file.mime.startsWith('image/')) {
        preview = `<img src='${fileUrl}' style='max-width:160px;max-height:120px;border-radius:6px'>`;
      } else if (p.file.mime === 'application/pdf') {
        preview = `<a href='${fileUrl}' target='_blank'>PDF预览</a>`;
      } else if (p.file.mime === 'text/html') {
        preview = `<iframe src='${fileUrl}' style='width:260px;height:160px;border:1px solid #eee;border-radius:6px'></iframe>`;
      } else {
        preview = `<a href='${fileUrl}' download='${p.file.filename}'>下载附件</a>`;
      }
    }
    const uname = p.username || '匿名';  // 使用新API返回的username字段
    const nameHtml = p.username
      ? `<a href="/profile.html?user=${encodeURIComponent(p.username)}">${escapeHtml(uname)}</a>`
      : `<span style="color:#999">${escapeHtml(uname)}</span>`;  // "匿名"不加链接
    
    el.innerHTML += `<div class="post">
      <div class="meta">${nameHtml} · ${new Date(p.created_at||p.createdAt).toLocaleString()}</div>
      <div>${escapeHtml(p.content||'')}</div>
      ${preview}
    </div>`;
  });
}

async function uploadFileIfAny(){
  const f = document.getElementById('fileInput').files[0];
  if(!f) return null;

  // 文件大小检查（10MB限制）
  if(f.size > 10 * 1024 * 1024) {
    throw new Error('文件过大，请选择小于 10MB 的文件');
  }

  const fd = new FormData();
  fd.append('file', f); // 字段名必须叫 'file'

  const userId = getUserId();
  const headers = {};
  if (userId) headers['X-User-Id'] = userId; // ← 不再用 Authorization，改用 X-User-Id

  const resp = await fetch('/api/files/upload', {
    method: 'POST',
    headers: headers,
    body: fd // 不要手动设置 Content-Type！
  });

  // 处理响应
  let data;
  const text = await resp.text();
  try { 
    data = JSON.parse(text); 
  } catch { 
    data = { ok: false, error: text }; 
  }

  if (!resp.ok || !data.ok) {
    throw new Error(data.error || `上传失败(${resp.status})`);
  }
  return data.id;
}

document.getElementById('send').onclick = async () => {
  const userId = getUserId();                 // ⛳ 检查 userId 而不是 token
  if(!userId) return alert('请先登录');

  const contentEl = document.getElementById('content');
  const content = contentEl.value.trim();
  const hasFile = !!document.getElementById('fileInput').files[0];
  if(!content && !hasFile) return;

  try{
    // 获取当前用户信息
    const me = JSON.parse(localStorage.getItem('currentUser') || 'null');
    if (!me || !me.username) {
      alert('请先登录');
      return;
    }

    // 如果有文件，先上传文件获取URL
    let image_url = null;
    const fileId = await uploadFileIfAny();
    if (fileId) {
      image_url = `/api/files/${fileId}`;
    }

    const payload = {
      content,
      image_url,
      username: me.username,
      user_id: me.id,
    };

    const resp = await fetch('/api/posts/add', {
      method: 'POST',
      headers: { 'Content-Type':'application/json' },
      body: JSON.stringify(payload)
    });

    const j = await resp.json();
    if(j.ok){
      contentEl.value=''; 
      document.getElementById('fileInput').value='';
      load();
    }else{
      alert(j.error || '失败');
    }
  } catch(e){
    alert(e.message || '失败');
  }
};

load(); setInterval(load, 3000);
checkDatabase();

// "我的"按钮点击处理
document.getElementById('mineLink').addEventListener('click', (e)=>{
  e.preventDefault();
  const me = JSON.parse(localStorage.getItem('currentUser') || 'null');
  if (!me?.username) return location.href = 'login.html';
  location.href = `/profile.html?user=${encodeURIComponent(me.username)}`;
});
</script>
</body></html>
