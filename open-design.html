<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
  <title>开放设计</title>
</head>
<body class="app-shell">
  <div class="bg-decor">
    <div class="floating-shape fs-1"></div>
    <div class="floating-shape fs-2"></div>
    <div class="floating-shape fs-3"></div>
  </div>

  <main class="page-main">
    <div class="container">
      <div class="page-header">
        <h2 class="page-title">
          <span class="badge-dot"></span>
          开放设计
        </h2>
        <div class="row">
          <a href="index.html" class="btn">← 返回讨论区</a>
        </div>
      </div>

      <!-- 投稿区 -->
      <div class="card emphasis">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <div style="font-size:14px;font-weight:600;color:#065f46;">提交你的作品</div>
          <div style="font-size:12px;color:#6b7280;">最多5MB；支持 HTML/TXT/ZIP/链接</div>
        </div>
        <div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap">
          <textarea id="desc" rows="3" placeholder="简要介绍你的作品（建议必填）" style="flex:1;min-width:260px"></textarea>
          <div style="display:flex;flex-direction:column;gap:8px;min-width:240px">
            <input id="link" placeholder="或粘贴一个外部链接（可选）" />
            <input type="file" id="file" accept=".html,.htm,.txt,.md,.zip,.pdf" />
            <button id="submit" class="btn btn-primary">提交</button>
          </div>
        </div>
        <div id="hint" class="link-muted" style="margin-top:8px;font-size:12px">至少提供文件或链接其一。HTML 可以小窗预览，TXT 显示摘要，链接将新开页。</div>
      </div>

      <!-- 列表区 -->
      <h3 style="margin:20px 0 10px">最新投稿</h3>
      <div id="list" class="grid"></div>
    </div>
  </main>

  <!-- 预览大窗 -->
  <div id="viewer" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;">
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(96vw,1100px);height:min(90vh,800px);background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:14px;display:flex;flex-direction:column;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div id="viewerTitle" style="font-weight:600;color:#065f46">预览</div>
        <button onclick="closeViewer()" class="btn" style="min-width:auto">关闭</button>
      </div>
      <div id="viewerBody" style="flex:1;min-height:0"></div>
    </div>
  </div>

<script>
const $ = s => document.querySelector(s);
const esc = s => (s||'').replace(/[&<>"']/g,m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[m]));

async function api(path, opt){
  // 强制绝对路径，避免 /open-design.html/ 前缀导致 404
  const url = new URL(path.startsWith('/') ? path : `/${path}`, location.origin).toString();
  const r = await fetch(url, Object.assign({ headers: {} }, opt));
  const t = await r.text();
  let j; try{ j = JSON.parse(t) } catch { j = { ok:false, error:t } }
  if (!r.ok || j.ok === false) throw new Error(j.error || r.statusText);
  return j;
}

function cardFor(post){
  const d = document.createElement('div'); d.className = 'card post-card';
  const time = new Date(post.created_at).toLocaleString();
  let preview = '';
  const ft = (post.file_type||'').toLowerCase();
  const hasFile = !!post.file_url;
  const extFromType = (t)=>{
    if (!t) return 'bin';
    if (t.includes('html')) return 'html';
    if (t.includes('pdf')) return 'pdf';
    if (t.includes('text') || t.includes('txt') || t.includes('markdown')) return 'txt';
    return 'bin';
  };
  const dlName = `design_${post.id || 'file'}.${extFromType(ft)}`;

  if (post.external_url){
    preview = `<a class="btn" href="${esc(post.external_url)}" target="_blank">打开外部链接</a>`;
  } else if (post.file_url){
    if (ft.includes('html')){
      preview = `
        <iframe src="${esc(post.file_url)}" style="width:100%;height:220px;border:1px solid var(--border);border-radius:10px;background:#fff"></iframe>
        <div style="display:flex;gap:8px;margin-top:8px">
          <a class="btn" href="${esc(post.file_url)}" target="_blank" rel="noopener">新窗口打开</a>
          <a class="btn" href="${esc(post.file_url)}" download="${esc(dlName)}">下载</a>
          <button class="btn" onclick='openViewer(${JSON.stringify({ id:post.id, url:post.file_url, type:ft })})'>放大预览</button>
        </div>`;
    } else if (ft.includes('text') || ft.includes('txt') || ft.includes('markdown')){
      preview = `
        <iframe src="${esc(post.file_url)}" style="width:100%;height:160px;border:1px solid var(--border);border-radius:10px;background:#fff"></iframe>
        <div style="display:flex;gap:8px;margin-top:8px">
          <a class="btn" href="${esc(post.file_url)}" target="_blank" rel="noopener">新窗口打开</a>
          <a class="btn" href="${esc(post.file_url)}" download="${esc(dlName)}">下载</a>
          <button class="btn" onclick='openViewer(${JSON.stringify({ id:post.id, url:post.file_url, type:ft })})'>放大预览</button>
        </div>`;
    } else if (ft.includes('pdf')){
      preview = `
        <iframe src="${esc(post.file_url)}" style="width:100%;height:260px;border:1px solid var(--border);border-radius:10px;background:#fff"></iframe>
        <div style="display:flex;gap:8px;margin-top:8px">
          <a class="btn" href="${esc(post.file_url)}" target="_blank" rel="noopener">新窗口打开</a>
          <a class="btn" href="${esc(post.file_url)}" download="${esc(dlName)}">下载</a>
        </div>`;
    } else {
      preview = `
        <div style="display:flex;gap:8px">
          <a class="btn" href="${esc(post.file_url)}" target="_blank" rel="noopener">打开</a>
          <a class="btn" href="${esc(post.file_url)}" download="${esc(dlName)}">下载</a>
        </div>`;
    }
  }

  d.innerHTML = `
    <div class="meta" style="color:var(--muted);font-size:12px">${time}</div>
    <div style="margin:.25rem 0;white-space:pre-wrap;line-height:1.6">${esc(post.description||'')}</div>
    <div style="margin-top:8px">${preview}</div>
  `;
  return d;
}

function openViewer(info){
  const box = $('#viewer');
  const body = $('#viewerBody');
  const title = $('#viewerTitle');
  title.textContent = `预览 #${info.id || ''}`.trim();
  const h = '78vh';
  body.innerHTML = `<iframe src="${esc(info.url)}" style="width:100%;height:${h};border:1px solid var(--border);border-radius:10px;background:#fff"></iframe>`;
  box.style.display = 'block';
}
function closeViewer(){ $('#viewer').style.display = 'none'; }

async function load(){
  try{
    const j = await api('/api/design/list');
    const box = $('#list'); box.innerHTML='';
    (j.data||[]).forEach(p => box.appendChild(cardFor(p)));
  }catch(e){
    alert('加载失败：' + e.message);
  }
}

async function uploadIfAny(){
  const f = $('#file').files[0];
  if (!f) return null;
  if (f.size > 5 * 1024 * 1024) throw new Error('文件过大，最大 5MB');
  const fd = new FormData(); fd.append('file', f);
  const url = new URL('/api/open/upload', location.origin).toString();
  const r = await fetch(url, { method:'POST', body: fd });
  const t = await r.text(); let j; try{ j = JSON.parse(t) } catch { j = { ok:false, error:t } }
  if (!r.ok || j.ok === false) throw new Error(j.error || '上传失败');
  return { url: j.url, mime_type: j.mime_type, size_bytes: j.size_bytes, storage_key: j.storage_key };
}

$('#submit').onclick = async () => {
  const description = $('#desc').value.trim();
  const link = $('#link').value.trim();
  try{
    const asset = await uploadIfAny();
    if (!asset && !link) return alert('请至少提供文件或链接其一');

    const payload = { description, external_url: link || null, asset: asset || null };
    const j = await api('/api/design/create', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });

    // 清空表单
    $('#desc').value = '';
    $('#link').value = '';
    $('#file').value = '';

    // 预置在顶部
    const box = $('#list');
    box.prepend(cardFor(j.post));
  }catch(e){
    alert(e.message || '提交失败');
  }
};

load();
</script>
</body>
</html>
