<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
  <title>个人空间</title>
  <style>
    .row{display:flex;gap:12px;align-items:center}
    .pill{padding:.25rem .6rem;border:1px solid #ddd;border-radius:999px;font-size:12px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
    .card{border:1px solid #eee;border-radius:10px;padding:10px}
  </style>
</head>
<body>
<div class="row">
  <a href="index.html">← 返回</a>
  <h2 style="margin:0">个人空间</h2>
  <span style="flex:1"></span>
  <button id="followBtn" class="pill">关注</button>
</div>

<div id="basic" class="row" style="margin:12px 0">
  <img id="avatar" src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iODAiIGhlaWdodD0iODAiIHZpZXdCb3g9IjAgMCA4MCA4MCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPGNpcmNsZSBjeD0iNDAiIGN5PSI0MCIgcj0iNDAiIGZpbGw9IiNmMGYwZjAiLz4KPHN2ZyB4PSIyOCIgeT0iMjAiIHdpZHRoPSIyNCIgaGVpZ2h0PSI0MCI+Cjx0ZXh0IHg9IjEyIiB5PSIzMiIgZm9udC1mYW1pbHk9InNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMjQiIGZpbGw9IiM2NjYiIHRleHQtYW5jaG9yPSJtaWRkbGUiPjwvdGV4dD4KPHN2Zz4=" alt="avatar" width="80" height="80" style="border-radius:50%;object-fit:cover">
  <div>
    <div id="name" style="font-size:20px;font-weight:600">—</div>
    <div id="bio" style="color:#666">—</div>
    <div id="stats" class="row" style="margin-top:6px;color:#666">
      <span id="postCount" class="pill">帖子 0</span>
      <span id="fileCount" class="pill">文件 0</span>
      <span id="follows"   class="pill">关注 0</span>
      <span id="fans"      class="pill">粉丝 0</span>
    </div>
  </div>
</div>

<h3 style="margin:12px 0 6px">TA 的帖子</h3>
<div id="posts" class="grid"></div>

<h3 style="margin:12px 0 6px">TA 的文件</h3>
<div id="files" class="grid"></div>

<script>
const getUserId = ()=>localStorage.getItem('userId');
const qs = new URLSearchParams(location.search);            // ✅ 不用正则
// 支持两种打开方式：?id=<uuid> 或 ?user=<用户名>
const targetId   = qs.get('id');
const targetName = qs.get('user');

async function api(path, opt={}) {
  const headers = opt.headers || {};
  const uid = getUserId();
  if (uid) headers['X-User-Id'] = uid;                      // 轻量模式，只带 userId
  opt.headers = headers;
  const r = await fetch(path, opt);
  const t = await r.text();
  let j; try { j = JSON.parse(t) } catch { j = { ok:false, error:t } }
  if (!r.ok || !j.ok) throw new Error(j.error || r.statusText);
  return j;
}

function renderPosts(list){
  const box = document.getElementById('posts'); box.innerHTML='';
  for(const p of list){
    const el = document.createElement('div'); el.className='card';
    
    const imgHtml = p.image_url
      ? `<img src="${(p.image_url)}" style="width:100%;max-height:220px;object-fit:cover;border-radius:8px">`
      : (p.file && p.file.mime && p.file.mime.startsWith('image/')
          ? `<img src="/api/files/${p.file.id}" style="width:100%;max-height:220px;object-fit:cover;border-radius:8px">`
          : p.file ? `<a href="/api/files/${p.file.id}" target="_blank">查看附件</a>` : '');

    el.innerHTML = `
      <div style="color:#666;font-size:12px">${new Date(p.created_at||p.createdAt).toLocaleString()}</div>
      <div style="margin:.25rem 0">${(p.content||'').replace(/[&<>"]/g,s=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[s]))}</div>
      ${imgHtml}
    `;
    box.appendChild(el);
  }
  document.getElementById('postCount').textContent = `帖子 ${list.length}`;
}

function renderFiles(list){
  const box = document.getElementById('files'); box.innerHTML='';
  for(const f of list){
    const el=document.createElement('div'); el.className='card';
    const url = `/api/files/${f.id}`;
    el.innerHTML = (f.mime||'').startsWith('image/')
      ? `<img src="${url}" style="width:100%;max-height:220px;object-fit:cover;border-radius:8px">`
      : `<a href="${url}" target="_blank">${f.filename||'文件'}</a>`;
    box.appendChild(el);
  }
  document.getElementById('fileCount').textContent = `文件 ${list.length}`;
}

let targetUser;   // 被查看的用户
let isFollowing = false;

async function loadProfile(){
  try {
    // 1) 拉取用户信息（优先 id，其次用户名）
    const info = targetId
      ? await api(`/api/users/get?id=${encodeURIComponent(targetId)}`)
      : await api(`/api/users/getByName?username=${encodeURIComponent(targetName||'')}`);
    targetUser = info.user;
    if (!targetUser) throw new Error('用户不存在');

    document.getElementById('name').textContent = targetUser.username || '未命名';
    document.getElementById('bio').textContent  = targetUser.bio || '这个人很低调，还没有写介绍。';
    if (targetUser.avatar_url) document.getElementById('avatar').src = targetUser.avatar_url;

    // 2) 关注状态 & 数量
    const st = await api(`/api/follow/stats?user_id=${targetUser.id}`);
    isFollowing = st.is_following;
    document.getElementById('follows').textContent = `关注 ${st.following_count}`;
    document.getElementById('fans').textContent    = `粉丝 ${st.followers_count}`;
    document.getElementById('followBtn').textContent = (getUserId() && getUserId()!==targetUser.id) ? (isFollowing ? '取消关注' : '关注') : '关注';

    // 3) 帖子、文件
    const posts = await api(`/api/posts/list?user_id=${targetUser.id}`);
    renderPosts(posts.data||[]);
    const files = await api(`/api/files/by-user?user_id=${targetUser.id}`);
    renderFiles(files.data||[]);
  } catch(e) {
    console.error('Profile load error:', e);
    throw e;
  }
}

document.getElementById('followBtn').onclick = async ()=>{
  if (!getUserId()) return alert('请先登录');
  if (getUserId()===targetUser.id) return alert('不能关注自己');
  try {
    const r = await api('/api/follow/toggle', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ target_id: targetUser.id })
    });
    isFollowing = r.following;
    document.getElementById('followBtn').textContent = isFollowing ? '取消关注' : '关注';
    // 刷新统计
    const st = await api(`/api/follow/stats?user_id=${targetUser.id}`);
    document.getElementById('follows').textContent = `关注 ${st.following_count}`;
    document.getElementById('fans').textContent    = `粉丝 ${st.followers_count}`;
  } catch(e) {
    alert('操作失败：' + e.message);
  }
};

loadProfile().catch(err=>{
  document.body.innerHTML = `<div style="padding:2rem;color:#c00">加载失败：${err.message}</div>`;
});
</script>
</body>
</html>
