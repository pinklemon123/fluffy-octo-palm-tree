<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
  <title>个人空间</title>
</head>
<body class="app-shell profile-page">
<main class="page-main">
<div class="container">
  <div class="page-header">
    <a href="index.html" class="btn">← 返回</a>
    <h2 class="page-title">
      <span class="badge-dot"></span>
      个人空间
    </h2>
    <div class="row">
      <a href="open-design.html" class="btn">开放设计</a>
      <button id="followBtn" class="btn btn-primary" style="display:none">关注</button>
      <button id="editBtn" class="btn" style="display:none">编辑资料</button>
    </div>
  </div>

  <!-- 用户信息卡片 -->
  <div class="card" style="display:flex;gap:16px;align-items:center">
    <img class="avatar" id="avatar" src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iODAiIGhlaWdodD0iODAiIHZpZXdCb3g9IjAgMCA4MCA4MCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPGNpcmNsZSBjeD0iNDAiIGN5PSI0MCIgcj0iNDAiIGZpbGw9IiNmMGYwZjAiLz4KPHN2ZyB4PSIyOCIgeT0iMjAiIHdpZHRoPSIyNCIgaGVpZ2h0PSI0MCI+Cjx0ZXh0IHg9IjEyIiB5PSIzMiIgZm9udC1mYW1pbHk9InNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMjQiIGZpbGw9IiM2NjYiIHRleHQtYW5jaG9yPSJtaWRkbGUiPjwvdGV4dD4KPHN2Zz4=" alt="avatar">
    <div style="flex:1">
      <div style="font-size:20px;font-weight:600" id="name">—</div>
      <div class="link-muted" id="bio">—</div>
      <div class="badge-row" style="margin-top:8px">
        <span class="badge">帖文 <b id="postCount">0</b></span>
        <button id="btnFollowers" class="btn">粉丝 <b id="fans">0</b></button>
        <button id="btnFollowing" class="btn">关注 <b id="follows">0</b></button>
      </div>
    </div>
  </div>

  <h3>TA 的帖子</h3>
  <div id="posts" class="grid"></div>

  <h3>TA 的文件</h3>
  <div id="files" class="grid"></div>
</div>
</main>

<!-- Modal弹窗 -->
<div id="modal" class="modal">
  <div class="modal-content">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <span id="modalTitle">标题</span>
      <button id="modalCloseBtn" style="background:none;border:none;font-size:18px;cursor:pointer">&times;</button>
    </div>
    <div id="modalBody">内容</div>
  </div>
</div>

<!-- 编辑资料弹窗 -->
<div id="editDlg" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:white;padding:20px;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);z-index:1001;width:400px">
  <h3 style="margin-top:0">编辑资料</h3>
  <div style="margin:10px 0">
    <label>昵称(显示名):</label><br>
    <input id="inpDisplay" placeholder="昵称(显示名)" style="width:100%;margin-top:4px;padding:8px;border:1px solid var(--border);border-radius:8px">
  </div>
  <div style="margin:10px 0">
    <label>头像URL:</label><br>
    <input id="inpAvatar" placeholder="头像URL" style="width:100%;margin-top:4px;padding:8px;border:1px solid var(--border);border-radius:8px">
  </div>
  <div style="margin:10px 0">
    <label>个人简介:</label><br>
    <textarea id="inpBio" placeholder="个人简介" style="width:100%;margin-top:4px;padding:8px;height:60px;border:1px solid var(--border);border-radius:8px"></textarea>
  </div>
  <div style="margin-top:15px;text-align:right">
    <button id="editCancelBtn" class="btn" style="margin-right:10px">取消</button>
    <button id="saveProfile" class="btn btn-primary">保存</button>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => (s||'').replace(/[&<>"']/g,m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
const qs = new URLSearchParams(location.search);
const username = qs.get('user') || '';

function me(){ try{ return JSON.parse(localStorage.getItem('currentUser')||'null'); }catch{ return null } }
async function api(path, opt){
  const r = await fetch(path, Object.assign({ headers: { } }, opt));
  const t = await r.text();
  let j; try { j = JSON.parse(t) } catch { j = { ok:false, error:t } }
  if (!r.ok || j.ok === false) throw new Error(j.error || r.statusText);
  return j;
}

function renderPosts(list){
  const box = $('#posts'); box.innerHTML='';
  (list||[]).forEach(p=>{
    const el = document.createElement('div'); el.className='card';
    const img = p.image_url
      ? `<div class="post-img"><img src="${esc(p.image_url)}" style="width:100%;max-height:220px;object-fit:cover;border-radius:8px;border:1px solid #eee"></div>`
      : (p.file && p.file.mime && p.file.mime.startsWith('image/')
          ? `<div class="post-img"><img src="/api/files/${p.file.id}" style="width:100%;max-height:220px;object-fit:cover;border-radius:8px;border:1px solid #eee"></div>`
          : (p.file ? `<a href="/api/files/${p.file.id}" target="_blank">查看附件</a>` : '')
        );
    el.innerHTML = `
      <div style="color:#666;font-size:12px">${new Date(p.created_at || p.createdAt).toLocaleString()}</div>
      <div style="margin:.25rem 0">${esc(p.content||'')}</div>
      ${img}
    `;
    box.appendChild(el);
  });
}

function renderFiles(list){
  const box = $('#files'); box.innerHTML='';
  (list||[]).forEach(f=>{
    const el = document.createElement('div'); el.className='card';
    const isImg = f.mime && f.mime.startsWith('image/');
    const url = f.url || `/api/files/${f.id}`;
    el.innerHTML = isImg
      ? `<img src="${esc(url)}" style="width:100%;height:200px;object-fit:cover;border-radius:8px;border:1px solid #eee">`
      : `<a href="${esc(url)}" target="_blank">${esc(f.filename||'文件')}</a>`;
    box.appendChild(el);
  });
}

let targetUser = null;
let isFollowing = false;

// Modal功能
function openModal(title, content) {
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = content;
  $('#modal').style.display = 'block';
}

function closeModal() {
  $('#modal').style.display = 'none';
}

function showUsersModal(title, users){
  const html = (users||[]).map(x=>`
    <div class="user-item">
      <img src="${x.avatar_url||'/default-avatar.png'}" class="avatar-sm" alt="avatar">
      <a href="/profile.html?user=${encodeURIComponent(x.username)}">${x.display_name||x.username}</a>
    </div>`).join('') || '<div style="color:var(--muted);text-align:center;padding:20px">空空如也</div>';
  openModal(title, html);
}

async function loadProfile(){
  if (!username) { location.href='index.html'; return; }

  try {
    // 1) 拉用户信息
    const ures = await api(`/api/users/getByName?username=${encodeURIComponent(username)}`);
    targetUser = ures.user;

    $('#name').textContent = targetUser.display_name || targetUser.username;
    $('#bio').textContent  = targetUser.bio || '这个人很低调，还没有写简介。';
    $('#avatar').src       = targetUser.avatar_url || '/default-avatar.png';

    // 2) 统计角标
    const st = await api(`/api/users/stats?user_id=${encodeURIComponent(targetUser.id)}`);
    $('#postCount').textContent = st.n_posts || 0;
    $('#fans').textContent      = st.n_followers || 0;
    $('#follows').textContent   = st.n_following || 0;

    // 3) 帖子 & 文件
    const posts = await api(`/api/posts/list?user_id=${encodeURIComponent(targetUser.id)}`);
    renderPosts(posts.data || []);
    
    // 文件加载 - 如果API不存在则跳过
    try {
      const files = await api(`/api/files/by-user?user_id=${encodeURIComponent(targetUser.id)}`);
      renderFiles(files.data || []);
    } catch(e) {
      console.log('files API not available:', e.message);
      $('#files').innerHTML = '<div class="card">文件功能暂不可用</div>';
    }

    // 4) 关注按钮（仅看别人时展示）
    const mine = me();
    const isSelf = !!(mine && mine.id === targetUser.id);
    const followBtn = $('#followBtn');
    const editBtn = $('#editBtn');
    
    if (isSelf) {
      followBtn.style.display = 'none';
      editBtn.style.display = 'inline-flex';
    } else if (mine && mine.id) {
      followBtn.style.display = 'inline-flex';
      editBtn.style.display = 'none';
      
      try {
        const s = await api(`/api/follow/status?follower_id=${encodeURIComponent(mine.id)}&followee_id=${encodeURIComponent(targetUser.id)}`);
        isFollowing = !!s.followed;
        followBtn.textContent = isFollowing ? '已关注' : '关注';
      } catch(e) {
        console.log('follow status check failed:', e.message);
        followBtn.textContent = '关注';
      }
    } else {
      followBtn.style.display = 'none';
      editBtn.style.display = 'none';
    }

    // 5) 绑定粉丝/关注列表点击事件
    $('#btnFollowers').onclick = async ()=>{
      try {
        const r = await api(`/api/follow/list?user_id=${encodeURIComponent(targetUser.id)}&type=followers`);
        showUsersModal('粉丝', r.users||[]);
      } catch(e) {
        alert('加载粉丝列表失败：' + e.message);
      }
    };

    $('#btnFollowing').onclick = async ()=>{
      try {
        const r = await api(`/api/follow/list?user_id=${encodeURIComponent(targetUser.id)}&type=following`);
        showUsersModal('关注', r.users||[]);
      } catch(e) {
        alert('加载关注列表失败：' + e.message);
      }
    };
  
  } catch(e) {
    console.error('Profile load error:', e);
    alert('加载失败：' + (e?.message || e));
    location.href = 'index.html';
  }
}

$('#followBtn').onclick = async ()=>{
  const mine = me();
  if (!mine?.id) { alert('请先登录'); return; }
  if (!targetUser?.id) return;
  if (mine.id === targetUser.id) { alert('不能关注自己'); return; }
  
  try {
    const r = await api('/api/follow/toggle', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ follower_id: mine.id, followee_id: targetUser.id })
    });
    isFollowing = !!r.followed;
    $('#followBtn').textContent = isFollowing ? '已关注' : '关注';
    
    // 更新统计数字
    const st = await api(`/api/users/stats?user_id=${encodeURIComponent(targetUser.id)}`);
    $('#fans').textContent = st.n_followers || 0;
  } catch(e) {
    alert('操作失败：' + e.message);
  }
};

// 编辑按钮功能
$('#editBtn').onclick = ()=>{
  if (!targetUser) return;
  $('#inpDisplay').value = targetUser.display_name || '';
  $('#inpAvatar').value  = targetUser.avatar_url   || '';
  $('#inpBio').value     = targetUser.bio          || '';
  $('#editDlg').style.display = 'block';
};

$('#saveProfile').onclick = async ()=>{
  const mine = me();
  if (!mine?.id) return alert('请先登录');
  
  const payload = {
    user_id: mine.id,
    display_name: $('#inpDisplay').value.trim(),
    avatar_url:   $('#inpAvatar').value.trim(),
    bio:          $('#inpBio').value.trim()
  };
  
  try {
    const r = await api('/api/users/update', { 
      method:'POST', 
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload) 
    });
    alert('已保存');
    $('#editDlg').style.display = 'none';
    location.reload();
  } catch(e) {
    alert('保存失败：' + e.message);
  }
};

// 点击modal背景关闭
$('#modal').onclick = (e) => {
  if (e.target.id === 'modal') closeModal();
};

// modal关闭按钮
$('#modalCloseBtn').onclick = closeModal;

// 编辑弹窗取消按钮
$('#editCancelBtn').onclick = () => {
  $('#editDlg').style.display = 'none';
};

loadProfile().catch(err=>{
  console.error(err);
  alert('加载失败：' + (err?.message || err));
});
</script>
</body>
</html>
