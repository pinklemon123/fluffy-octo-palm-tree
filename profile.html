<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
  <title>个人空间</title>
  <style>
    :root{
      --brand:#22c55e;      /* 主绿色 */
      --brand-600:#16a34a;
      --brand-50:#ecfdf5;
      --text:#111827;
      --muted:#6b7280;
      --card:#ffffff;
      --bg:#f6f7f8;
      --border:#e5e7eb;
      --radius:14px;
      --shadow:0 6px 24px rgba(16,185,129,.12);
    }

    html,body{background:var(--bg); color:var(--text); margin:0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;}
    .container{max-width:920px;margin:0 auto;padding:24px;}
    
    .row{display:flex;gap:12px;align-items:center}
    
    .badge{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;background:var(--brand-50);color:var(--brand-600);font-size:12px;border:1px solid #d1fae5}
    
    .btn{
      display:inline-flex;align-items:center;justify-content:center;
      padding:8px 14px;border-radius:12px;border:1px solid var(--border);
      background:#fff; transition:.2s; cursor:pointer; text-decoration:none;
    }
    .btn:hover{box-shadow:var(--shadow)}
    .btn-primary{background:var(--brand); color:#fff; border-color:var(--brand); }
    .btn-primary:hover{background:var(--brand-600)}

    .card{
      background:var(--card); border:1px solid var(--border);
      border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin:12px 0;
    }

    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
    .avatar{width:64px;height:64px;border-radius:50%;border:2px solid var(--brand-50);object-fit:cover}
    .avatar-sm{width:28px;height:28px;border-radius:50%;object-fit:cover;border:1px solid var(--border)}

    .badge-row{display:flex;gap:8px;flex-wrap:wrap}
    .link-muted{color:var(--muted);text-decoration:none}
    .link-muted:hover{color:var(--brand-600)}

    /* Modal styles */
    .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;display:none}
    .modal-content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:white;padding:20px;border-radius:var(--radius);max-width:400px;width:90%}
    .user-item{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
    .user-item:last-child{border-bottom:none}
    .user-item a{color:var(--text);text-decoration:none;font-weight:500}
    .user-item a:hover{color:var(--brand-600)}
  </style>
</head>
<body>
<div class="container">
  <div class="row" style="margin-bottom:20px">
    <a href="index.html" class="btn">← 返回</a>
    <h2 style="margin:0;flex:1">个人空间</h2>
    <button id="followBtn" class="btn btn-primary" style="display:none">关注</button>
    <button id="editBtn" class="btn" style="display:none">编辑资料</button>
  </div>

  <!-- 用户信息卡片 -->
  <div class="card" style="display:flex;gap:16px;align-items:center">
    <img class="avatar" id="avatar" src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iODAiIGhlaWdodD0iODAiIHZpZXdCb3g9IjAgMCA4MCA4MCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPGNpcmNsZSBjeD0iNDAiIGN5PSI0MCIgcj0iNDAiIGZpbGw9IiNmMGYwZjAiLz4KPHN2ZyB4PSIyOCIgeT0iMjAiIHdpZHRoPSIyNCIgaGVpZ2h0PSI0MCI+Cjx0ZXh0IHg9IjEyIiB5PSIzMiIgZm9udC1mYW1pbHk9InNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMjQiIGZpbGw9IiM2NjYiIHRleHQtYW5jaG9yPSJtaWRkbGUiPjwvdGV4dD4KPHN2Zz4=" alt="avatar">
    <div style="flex:1">
      <div style="font-size:20px;font-weight:600" id="name">—</div>
      <div class="link-muted" id="bio">—</div>
      <div class="badge-row" style="margin-top:8px">
        <span class="badge">帖文 <b id="badgePosts">0</b></span>
        <button id="btnFollowers" class="btn">粉丝 <b id="badgeFollowers">0</b></button>
        <button id="btnFollowing" class="btn">关注 <b id="badgeFollowing">0</b></button>
      </div>
    </div>
  </div>

  <h3 style="margin:20px 0 10px">TA 的帖子</h3>
  <div id="posts" class="grid"></div>

  <h3 style="margin:20px 0 10px">TA 的文件</h3>
  <div id="files" class="grid"></div>
</div>

<!-- Modal弹窗 -->
<div id="modal" class="modal">
  <div class="modal-content">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <span id="modalTitle">标题</span>
      <button onclick="closeModal()" style="background:none;border:none;font-size:18px;cursor:pointer">&times;</button>
    </div>
    <div id="modalBody">内容</div>
  </div>
</div>

<!-- 编辑资料弹窗 -->
<div id="editDlg" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:white;padding:20px;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);z-index:1001;width:400px">
  <h3 style="margin-top:0">编辑资料</h3>
  <div style="margin:10px 0">
    <label>昵称(显示名):</label><br>
    <input id="inpDisplay" placeholder="昵称(显示名)" style="width:100%;margin-top:4px;padding:8px;border:1px solid var(--border);border-radius:8px">
  </div>
  <div style="margin:10px 0">
    <label>头像URL:</label><br>
    <input id="inpAvatar" placeholder="头像URL" style="width:100%;margin-top:4px;padding:8px;border:1px solid var(--border);border-radius:8px">
  </div>
  <div style="margin:10px 0">
    <label>个人简介:</label><br>
    <textarea id="inpBio" placeholder="个人简介" style="width:100%;margin-top:4px;padding:8px;height:60px;border:1px solid var(--border);border-radius:8px"></textarea>
  </div>
  <div style="margin-top:15px;text-align:right">
    <button onclick="document.getElementById('editDlg').style.display='none'" class="btn" style="margin-right:10px">取消</button>
    <button id="saveProfile" class="btn btn-primary">保存</button>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => (s||'').replace(/[&<>"']/g,m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
const qs = new URLSearchParams(location.search);
const username = qs.get('user') || '';

function me(){ try{ return JSON.parse(localStorage.getItem('currentUser')||'null'); }catch{ return null } }
async function api(path, opt){
  const r = await fetch(path, Object.assign({ headers: { } }, opt));
  const t = await r.text();
  let j; try { j = JSON.parse(t) } catch { j = { ok:false, error:t } }
  if (!r.ok || j.ok === false) throw new Error(j.error || r.statusText);
  return j;
}

function renderPosts(list){
  const box = $('#posts'); box.innerHTML='';
  (list||[]).forEach(p=>{
    const el = document.createElement('div'); el.className='card';
    const img = p.image_url
      ? `<div class="post-img"><img src="${esc(p.image_url)}" style="width:100%;max-height:220px;object-fit:cover;border-radius:8px;border:1px solid #eee"></div>`
      : (p.file && p.file.mime && p.file.mime.startsWith('image/')
          ? `<div class="post-img"><img src="/api/files/${p.file.id}" style="width:100%;max-height:220px;object-fit:cover;border-radius:8px;border:1px solid #eee"></div>`
          : (p.file ? `<a href="/api/files/${p.file.id}" target="_blank">查看附件</a>` : '')
        );
    el.innerHTML = `
      <div style="color:#666;font-size:12px">${new Date(p.created_at || p.createdAt).toLocaleString()}</div>
      <div style="margin:.25rem 0">${esc(p.content||'')}</div>
      ${img}
    `;
    box.appendChild(el);
  });
}

function renderFiles(list){
  const box = $('#files'); box.innerHTML='';
  (list||[]).forEach(f=>{
    const el = document.createElement('div'); el.className='card';
    const isImg = f.mime && f.mime.startsWith('image/');
    const url = f.url || `/api/files/${f.id}`;
    el.innerHTML = isImg
      ? `<img src="${esc(url)}" style="width:100%;height:200px;object-fit:cover;border-radius:8px;border:1px solid #eee">`
      : `<a href="${esc(url)}" target="_blank">${esc(f.filename||'文件')}</a>`;
    box.appendChild(el);
  });
}

let targetUser = null;
let isFollowing = false;

async function loadProfile(){
  if (!username) { location.href='index.html'; return; }

  // 1) 拉用户信息
  const ures = await api(`/api/users/getByName?username=${encodeURIComponent(username)}`);
  targetUser = ures.user;

  $('#name').textContent = targetUser.display_name || targetUser.username;
  $('#bio').textContent  = targetUser.bio || '这个人很低调，还没有写简介。';
  $('#avatar').src       = targetUser.avatar_url || '/default-avatar.png';

  // 2) 统计角标
  const st = await api(`/api/users/stats?user_id=${encodeURIComponent(targetUser.id)}`);
  $('#postCount').textContent = `帖子 ${st.n_posts}`;
  $('#fileCount').textContent = `文件 ${(st.n_files||0) || (st.files_count||0) || 0}`;
  $('#fans').textContent      = `粉丝 ${st.n_followers}`;
  $('#follows').textContent   = `关注 ${st.n_following}`;

  // 3) 帖子 & 文件
  const posts = await api(`/api/posts/list?user_id=${encodeURIComponent(targetUser.id)}`);
  renderPosts(posts.data || []);
  // 如果你没有 /api/files/by-user，可以把下一行替换为从 posts 中抽取图片 URL。
  const files = await api(`/api/files/by-user?user_id=${encodeURIComponent(targetUser.id)}`).catch(()=>({data:[]}));
  renderFiles(files.data || []);

  // 4) 关注按钮（仅看别人时展示）
  const mine = me();
  const isSelf = !!(mine && mine.id === targetUser.id);
  const btn = $('#followBtn');
  btn.style.display = isSelf ? 'none' : 'inline-flex';
  if (!isSelf && mine && mine.id){
    const s = await api(`/api/follow/status?follower_id=${encodeURIComponent(mine.id)}&followee_id=${encodeURIComponent(targetUser.id)}`).catch(()=>({followed:false}));
    isFollowing = !!s.followed;
    btn.textContent = isFollowing ? '已关注' : '关注';
  }
}

$('#followBtn').onclick = async ()=>{
  const mine = me();
  if (!mine?.id) { alert('请先登录'); return; }
  if (!targetUser?.id) return;
  if (mine.id === targetUser.id) { alert('不能关注自己'); return; }
  const r = await api('/api/follow/toggle', {
    method:'POST',
    body: JSON.stringify({ follower_id: mine.id, followee_id: targetUser.id })
  });
  isFollowing = !!r.followed;
  $('#followBtn').textContent = isFollowing ? '已关注' : '关注';
};

loadProfile().catch(err=>{
  console.error(err);
  alert('加载失败：' + (err?.message || err));
});
</script>
</body>
</html>
